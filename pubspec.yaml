name: receiptwise
description: An on-device receipt scanner and local expense tracker.
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  sqflite: ^2.3.3
  camera: ^0.12.1
  path_provider: ^2.1.5
  image: ^4.10.1
  google_mlkit_text_recognition: ^0.17.1
  provider: ^6.1.5+1
  image_picker: ^1.2.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: '>=2.3.3 <2.4.0'
  camera_platform_interface: ^2.14.0

flutter:
  uses-material-design: true
